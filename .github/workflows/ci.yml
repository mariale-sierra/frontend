# Sprint 10 (B10/B12): CI de la app. Hasta ahora el frontend no tenía ninguno.
#
# Corre en cada push y en cada PR a development/main: tipos, claves i18n en/es
# y la suite de Jest con cobertura (el reporte queda como artefacto). No
# construye ni publica builds de EAS; eso sigue siendo manual.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .npmrc ya trae legacy-peer-deps=true, igual que el install local.
      - name: Instalar dependencias
        run: npm ci

      - name: Tipos (tsc --noEmit)
        run: npm run typecheck

      - name: Claves i18n en/es
        run: npm run i18n:check

      # La mitad de los núcleos: con todos a la vez, unas cuantas pruebas de
      # hooks con timers llegaron a pasar su timeout por pura carga.
      - name: Pruebas (Jest) con cobertura
        run: npx jest --ci --coverage --maxWorkers=50%

      - name: Subir reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
